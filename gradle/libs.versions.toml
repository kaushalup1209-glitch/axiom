[versions]
# ===== SECTION: VERSIONS_BUILD_TOOLING =====
agp = "9.5.2"
kotlin = "2.4.21"
# ===== END SECTION: VERSIONS_BUILD_TOOLING =====

# ===== SECTION: VERSIONS_ANDROIDX =====
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.1"
androidxNavigation = "2.10.2"
androidxDatastore = "1.3.0"
composeBom = "2026.11.01"
# ===== END SECTION: VERSIONS_ANDROIDX =====

# ===== SECTION: VERSIONS_THIRD_PARTY =====
kotlinxSerialization = "1.13.0"
kotlinxCoroutines = "1.11.0"
# Kyant0 Liquid Glass (Backdrop) library and its shape primitives.
kyantBackdrop = "2.0.1"
kyantShapes = "1.2.1"
# ===== END SECTION: VERSIONS_THIRD_PARTY =====

# ===== SECTION: VERSIONS_TESTING =====
junit = "4.13.2"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
# ===== END SECTION: VERSIONS_TESTING =====

[libraries]
# ===== SECTION: LIBRARIES_ANDROIDX =====
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
# ===== END SECTION: LIBRARIES_ANDROIDX =====

# ===== SECTION: LIBRARIES_COMPOSE =====
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# ===== END SECTION: LIBRARIES_COMPOSE =====

# ===== SECTION: LIBRARIES_THIRD_PARTY =====
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kyant-backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "kyantBackdrop" }
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "kyantShapes" }
# ===== END SECTION: LIBRARIES_THIRD_PARTY =====

# ===== SECTION: LIBRARIES_TESTING =====
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExtJunit" }
# ===== END SECTION: LIBRARIES_TESTING =====

[plugins]
# ===== SECTION: PLUGINS =====
android-application = { id = "com.android.application", version.ref = "agp" }
# Declared only to pin the Kotlin Gradle Plugin version used by AGP 9 built-in Kotlin.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# ===== END SECTION: PLUGINS =====
